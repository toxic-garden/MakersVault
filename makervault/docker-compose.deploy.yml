version: "3.9"

# Deploy compose for the GHCR-published images.
# Intended for use behind a reverse proxy (the API is not published to the host).
# For direct/LAN access, also use docker-compose.deploy.local.yml.
# Override these image references with env vars if you want a different tag or registry.

services:
  api:
    image: ghcr.io/toxic-garden/makersvaultrevived-api:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-super-secret}
      - AUTH_SECRET=${AUTH_SECRET:-changeme-secret}
      - AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-86400}
      - FILE_STORAGE=/app/storage
      - DB_URL=sqlite:////app/data/app.db
      - PUBLIC_URL=${PUBLIC_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Mount import (server-side scan of an existing STL/3MF library, no copy)
      - IMPORT_MOUNT_PATH=${IMPORT_MOUNT_PATH:-}
      - IMPORT_MOUNT_ON_STARTUP=${IMPORT_MOUNT_ON_STARTUP:-true}
      - IMPORT_MOUNT_COPY=${IMPORT_MOUNT_COPY:-false}
      - IMPORT_MOUNT_EXTS=${IMPORT_MOUNT_EXTS:-}
      - IMPORT_MOUNT_INCLUDE_HIDDEN=${IMPORT_MOUNT_INCLUDE_HIDDEN:-false}
    volumes:
      - makersvault_storage:/app/storage
      - makersvault_db:/app/data
      # Bind-mount your existing STL/3MF library into the container so the
      # mount-import scan can index it without copying. IMPORT_MOUNT_PATH must
      # be set to the path INSIDE the container (e.g. /library). Map your host
      # folder here, e.g.:  ./3d-library:/library:ro
      - ${MOUNT_IMPORT_SOURCE:-./library}:/library:ro
    expose:
      - "8000"

  web:
    image: ghcr.io/toxic-garden/makersvaultrevived-web:latest
    restart: unless-stopped
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  makersvault_storage:
  makersvault_db:
