version: "3.9"

# Deploy compose for the GHCR-published images.
# Override these image references with env vars if you want a different tag or registry.

services:
  api:
    image:  ghcr.io/toxic-garden/makersvaultrevived-api:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-super-secret}
      - AUTH_SECRET=${AUTH_SECRET:-changeme-secret}
      - AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-86400}
      - FILE_STORAGE=/app/storage
      - DB_URL=sqlite:////app/data/app.db
      - PUBLIC_URL=${PUBLIC_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - makersvault_storage:/app/storage
      - makersvault_db:/app/data
    expose:
      - "8000"

  web:
    image: docker pull ghcr.io/toxic-garden/makersvaultrevived-web:latest
    restart: unless-stopped
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  makersvault_storage:
  makersvault_db:
